<title>GeneticWing en mouvement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one slide at a time, an animated stage on the left and its explanation on the right, navigation underneath; stacks on phones. */
:root {
  --bg: #eef2f4; --surface: #ffffff; --ink: #14212b; --muted: #586a77; --line: #cdd6dd; --chip: #e4eaee;
  --stage: #e2eaf0; --grid: #c3cfd8; --sky: #2f6db0; --climb: #17936a; --sink: #c9502f; --therm: #e39a2d; --violet: #7b4fb0;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151c; --surface: #15202a; --ink: #e2eaef; --muted: #8b9daa; --line: #283642; --chip: #1d2a35;
    --stage: #0f1a23; --grid: #253440; --sky: #6ea6e4; --climb: #39c58c; --sink: #ee7857; --therm: #f0b24c; --violet: #b48ae6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151c; --surface: #15202a; --ink: #e2eaef; --muted: #8b9daa; --line: #283642; --chip: #1d2a35;
  --stage: #0f1a23; --grid: #253440; --sky: #6ea6e4; --climb: #39c58c; --sink: #ee7857; --therm: #f0b24c; --violet: #b48ae6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 16px 20px; display: grid; gap: 14px; min-height: 100%; grid-template-rows: auto 1fr auto; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: 0.02em; }
.brand span { color: var(--muted); font-weight: 500; }
.count { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.slide { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
.stage { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 360px; aspect-ratio: 16 / 10; max-width: 100%; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.controls { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.controls label { display: flex; align-items: center; gap: 8px; }
.controls input[type=range] { width: 140px; accent-color: var(--sky); }
.controls b { font: 500 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 13px var(--body); background: transparent; color: var(--ink); border: 0; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.text { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.kicker { font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--sky); }
.text h1 { font: 700 clamp(26px, 3vw, 34px)/1.08 var(--display); margin: 0; text-wrap: balance; }
.text p { margin: 0; max-width: 60ch; }
.text ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.big { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--chip); border-radius: 10px; padding: 8px 12px; min-width: 120px; flex: 1 1 120px; }
.stat .v { font: 600 24px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.good { color: var(--climb); } .bad { color: var(--sink); }
.note { font-size: 12.5px; color: var(--muted); }
.formula { font: 14px var(--mono); background: var(--chip); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
nav > button { font: 600 14px/1 var(--body); background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
nav > button:disabled { opacity: 0.35; cursor: default; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 300px; }
.dots button { font: 500 12px var(--body); color: var(--muted); background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.dots button[aria-current="step"] { color: var(--ink); border-color: var(--ink); background: var(--surface); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); margin-right: 4px; }
.chip.ok { color: var(--climb); border-color: var(--climb); } .chip.part { color: var(--therm); border-color: var(--therm); } .chip.no { color: var(--sink); border-color: var(--sink); }
@media (max-width: 860px) { .slide { grid-template-columns: minmax(0, 1fr); } .stage { min-height: 300px; } }
@media (max-width: 420px) { .wrap { padding-inline: 16px; } .controls input[type=range] { width: 100px; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">GeneticWing <span>· comment tout marche</span></div>
    <div class="count" id="count"></div>
  </div>
  <div class="slide">
    <div class="stage" id="stage"><canvas id="cv" aria-label="Animation de la slide"></canvas><div class="controls" id="controls" hidden></div></div>
    <div class="text" id="text" aria-live="polite"></div>
  </div>
  <nav>
    <button id="prev" type="button">Précédent</button>
    <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
    <button id="next" type="button">Suivant</button>
  </nav>
</div>

<script>
const LIVE = /*LIVE_JSON*/null;

(function () {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let C = {};
  const readColors = () => { const s = getComputedStyle(document.documentElement); ["bg","surface","ink","muted","line","chip","stage","grid","sky","climb","sink","therm","violet"].forEach(k => C[k] = s.getPropertyValue("--" + k).trim()); C.mono = s.getPropertyValue("--mono"); C.body = s.getPropertyValue("--body"); };
  readColors();
  const fr = (x, d = 1) => x.toFixed(d).replace(".", ",").replace("-", "−");
  let W = 0, H = 0;
  function resize() { const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const text = (s, x, y, o = {}) => { ctx.font = `${o.weight || 400} ${o.size || 13}px ${o.mono ? C.mono : C.body}`; ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic"; ctx.fillText(s, x, y); };
  const line = (pts, color, w = 1.5, dash) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); };
  const dot = (x, y, r, color) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = color; ctx.fill(); };
  const alpha = (hex, a) => { const h = hex.replace("#", ""); const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const varioColor = vz => { const u = Math.max(-1, Math.min(1, vz >= 0 ? vz / 3 : vz / 2)); return u >= 0 ? mix(C.muted, C.climb, u) : mix(C.muted, C.sink, -u); };
  function mix(a, b, u) { const p = h => { const n = parseInt(h.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }; const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(",")})`; }
  function arrow(x0, y0, x1, y1, color, w = 1.6) { line([[x0, y0], [x1, y1]], color, w); const a = Math.atan2(y1 - y0, x1 - x0), s = 7; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - s * Math.cos(a - 0.4), y1 - s * Math.sin(a - 0.4)); ctx.lineTo(x1 - s * Math.cos(a + 0.4), y1 - s * Math.sin(a + 0.4)); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); }
  function box(x, y, w, h, label, sub, color) { ctx.fillStyle = C.surface; ctx.strokeStyle = color || C.line; ctx.lineWidth = color ? 1.8 : 1; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.stroke(); text(label, x + w / 2, y + h / 2 - (sub ? 4 : -4), { align: "center", weight: 600, size: 13 }); if (sub) text(sub, x + w / 2, y + h / 2 + 13, { align: "center", size: 11, color: C.muted }); }

  // A thermal seen from above: Gaussian core.
  function thermalTop(cx, cy, rpx, a = 0.55) { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rpx * 2); g.addColorStop(0, alpha(C.therm, a)); g.addColorStop(0.5, alpha(C.therm, a * 0.35)); g.addColorStop(1, alpha(C.therm, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rpx * 2, 0, 2 * Math.PI); ctx.fill(); }

  // ---------------------------------------------------------------- slides
  const S = [];

  S.push({ name: "Le défi", html: `
    <div class="kicker">Le défi</div>
    <h1>Faire monter un drone dans l'air chaud, au lieu de vider sa batterie</h1>
    <p>Un thermique est une colonne d'air qui monte, d'environ 60&nbsp;m de large. Un planeur qui tourne au bon endroit y monte sans moteur. Le SB-XC (4,6&nbsp;m d'envergure, 4,2&nbsp;kg) doit trouver ces cercles tout seul, et vite.</p>
    <div class="big"><div class="stat"><div class="v">1</div><div class="k">score d'un vol au moteur</div></div><div class="stat"><div class="v good">−5</div><div class="k">5 minutes de moteur gagnées en 1 minute</div></div></div>
    <p class="note">Le score compte la batterie dépensée moins l'énergie gagnée (altitude, vitesse). Plus il est négatif, mieux c'est.</p>`,
    draw(t) {
      const cx = W * 0.5, base = H * 0.86, top = H * 0.08;
      const g = ctx.createLinearGradient(cx - 90, 0, cx + 90, 0); g.addColorStop(0, alpha(C.therm, 0)); g.addColorStop(0.5, alpha(C.therm, 0.32)); g.addColorStop(1, alpha(C.therm, 0));
      ctx.fillStyle = g; ctx.fillRect(cx - 90, top, 180, base - top);
      for (let k = 0; k < 14; k++) { const yy = base - ((t * 40 + k * 60) % (base - top)); dot(cx - 50 + (k * 37 % 100), yy, 2, alpha(C.therm, 0.6)); }
      line([[W * 0.05, base], [W * 0.95, base]], C.grid, 1);
      const pts = []; const n = 220, T = 14, tt = (t % T) / T;
      for (let i = 0; i <= n; i++) { const u = i / n * tt; const a = u * 9 * Math.PI; const zz = base - 20 - u * (base - top - 50); const x = cx + 60 * Math.cos(a), depth = Math.sin(a); pts.push([x, zz + 10 * depth, depth]); }
      for (let i = 1; i < pts.length; i++) line([pts[i - 1], pts[i]], pts[i][2] < 0 ? alpha(C.climb, 0.4) : C.climb, 2.2);
      const p = pts[pts.length - 1]; dot(p[0], p[1], 5, C.ink);
      text(`altitude ${Math.round(200 + tt * 180)} m`, W * 0.06, H * 0.12, { mono: true, size: 13 });
      text("thermique", cx + 96, base - 12, { color: C.muted, size: 12 });
    } });

  S.push({ name: "Pourquoi c'est dur", controls: `<label for="rad">Rayon du cercle <input id="rad" type="range" min="10" max="80" value="30"><b id="radv"></b></label><label for="off">Décalage du centre <input id="off" type="range" min="0" max="40" value="0"><b id="offv"></b></label>`,
    html: `
    <div class="kicker">Pourquoi c'est dur</div>
    <h1>Trop serré, l'aile intérieure décroche. Trop large, on sort de l'ascendance.</h1>
    <p>Règle le rayon et le décalage du cercle : le vario donne la vitesse de montée. Plus on serre, plus on s'incline et plus on chute ; en dessous d'environ 18&nbsp;m l'aile intérieure, plus lente, décroche. Et 15&nbsp;m d'erreur sur le centre coûtent presque tout le gain.</p>
    <p class="note">Modèle simplifié pour l'illustration : cœur gaussien de 30&nbsp;m, vitesse 9,5&nbsp;m/s, chute qui croît avec l'inclinaison.</p>`,
    setup() { ["rad", "off"].forEach(id => $(id).addEventListener("input", () => {})); },
    draw(t) {
      const R = +$("rad").value, off = +$("off").value; $("radv").textContent = R + " m"; $("offv").textContent = off + " m";
      const V = 9.5, g = 9.81, bank = Math.atan(V * V / (g * R)), sink = 0.55 / Math.pow(Math.cos(bank), 1.5);
      const w = d => 3.6 * Math.exp(-((d / 30) ** 2));
      let m = 0; for (let k = 0; k < 64; k++) { const a = k / 64 * 2 * Math.PI; m += w(Math.hypot(off + R * Math.cos(a), R * Math.sin(a))); } m /= 64;
      const climb = m - sink, stall = R < 18;
      const sc = Math.min(W, H) / 220, cx = W * 0.38, cy = H * 0.45;
      thermalTop(cx, cy, 30 * sc, 0.6);
      ctx.beginPath(); ctx.arc(cx + off * sc, cy, R * sc, 0, 2 * Math.PI); ctx.strokeStyle = stall ? C.sink : C.sky; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
      const a = t * V / R; dot(cx + (off + R * Math.cos(a)) * sc, cy + R * Math.sin(a) * sc, 6, C.ink);
      dot(cx, cy, 3, C.therm); text("cœur", cx + 6, cy - 6, { size: 11, color: C.muted });
      // vario gauge
      const gx = W * 0.8, gy = H * 0.45, gr = Math.min(W, H) * 0.18;
      ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.75, Math.PI * 2.25); ctx.strokeStyle = C.line; ctx.lineWidth = 10; ctx.stroke();
      const v = Math.max(-3, Math.min(3, climb)), ang = Math.PI * 1.5 + v / 3 * Math.PI * 0.75;
      ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 1.5, ang, v < 0); ctx.strokeStyle = v >= 0 ? C.climb : C.sink; ctx.stroke(); ctx.lineWidth = 1;
      text((climb >= 0 ? "+" : "") + fr(climb, 2) + " m/s", gx, gy + 6, { align: "center", mono: true, size: 20, weight: 500, color: v >= 0 ? C.climb : C.sink });
      text("vario", gx, gy + 28, { align: "center", size: 12, color: C.muted });
      text(`inclinaison ${Math.round(bank * 180 / Math.PI)}°`, gx, gy + gr + 22, { align: "center", size: 12, mono: true });
      if (stall) text("décrochage de l'aile intérieure", gx, gy - gr - 12, { align: "center", size: 13, weight: 600, color: C.sink });
    } });

  S.push({ name: "La physique", html: `
    <div class="kicker">La physique</div>
    <h1>Une trajectoire suffit pour connaître tout le reste</h1>
    <p>En vol coordonné, la position au cours du temps et le vent donnent directement la portance, l'inclinaison et la poussée nécessaire : c'est la <b>platitude différentielle</b>. Pas d'intégration, on évalue des milliers de trajectoires d'un coup.</p>
    <div class="formula">F = m(a + g·ẑ) → C<sub>L</sub> = |L|/(qS), φ = atan2(L·r̂, L·û), T = F·v̂ + qS·C<sub>D</sub></div>
    <p>L'aile est découpée en 40 tronçons : en virage, l'aile intérieure vole moins vite que l'extérieure et décroche la première.</p>`,
    draw(t) {
      const cx = W * 0.5, cy = H * 0.52, s = Math.min(W, H) / 7, phi = 0.5 * Math.sin(t * 0.7);
      line([[W * 0.08, cy], [W * 0.92, cy]], C.grid, 1);
      const c = Math.cos(phi), sn = Math.sin(phi), span = 2.4 * s;
      line([[cx - span * c, cy - span * sn], [cx + span * c, cy + span * sn]], C.ink, 4);
      dot(cx, cy, 6, C.ink);
      const L = 1.6 * s; arrow(cx, cy, cx + L * sn, cy - L * c, C.climb, 2.2); text("portance", cx + L * sn + 8, cy - L * c, { color: C.climb, size: 13 });
      arrow(cx, cy, cx, cy + 1.3 * s, C.sink, 2.2); text("poids", cx + 8, cy + 1.3 * s, { color: C.sink, size: 13 });
      arrow(cx, cy, cx + L * sn, cy, C.sky, 2); text("force qui fait tourner", cx + L * sn + (phi > 0 ? 8 : -150), cy + 16, { color: C.sky, size: 12 });
      const inner = phi > 0 ? 1 : -1;
      [-1, 1].forEach(side => { const v = 9.5 * (1 + side * inner * 0.18 * Math.abs(phi) / 0.5); const x = cx + side * span * 0.9 * c, y = cy + side * span * 0.9 * sn;
        const hgt = v * 7; ctx.fillStyle = side === inner ? alpha(C.sink, 0.7) : alpha(C.sky, 0.6); ctx.fillRect(x - 8, H * 0.2 - hgt + 60, 16, hgt);
        text(`${fr(v, 1)} m/s`, x, H * 0.2 + 76, { align: "center", size: 11, mono: true }); text(side === inner ? "intérieure" : "extérieure", x, H * 0.2 + 90, { align: "center", size: 11, color: C.muted }); });
      text(`inclinaison ${Math.round(Math.abs(phi) * 180 / Math.PI)}°`, W * 0.06, H * 0.9, { mono: true, size: 13 });
      text("vue de l'arrière", W * 0.94, H * 0.9, { align: "right", size: 12, color: C.muted });
    } });

  // Teacher: raw GA vs law + NLP.
  const rng = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
  S.push({ name: "Le professeur", html: `
    <div class="kicker">Phase 2 · le professeur</div>
    <h1>Un GA sur la trajectoire brute échoue. Une loi de pilotage + un optimiseur réussit.</h1>
    <p>Sur 87 paramètres couplés, l'algorithme génétique tâtonne sans trouver le cercle. Une loi réactive (« tourne autour du centre à tel rayon ») donne la forme, puis l'optimiseur local SLSQP la peaufine : c'est le <b>professeur</b>, lent (≈35&nbsp;s) mais excellent.</p>
    <div class="big"><div class="stat"><div class="v bad">+0,15</div><div class="k">GA brut (thermique S1)</div></div><div class="stat"><div class="v good">−6,04</div><div class="k">loi + optimiseur</div></div></div>`,
    draw(t) {
      const half = W / 2, sc = Math.min(half, H) / 260;
      [[half * 0.5, "GA sur 87 gènes"], [half * 1.5, "loi réactive + SLSQP"]].forEach(([cx, lab], k) => {
        const cy = H * 0.48; thermalTop(cx, cy, 30 * sc * 1.4, 0.5); text(lab, cx, H * 0.1, { align: "center", weight: 600, size: 14 });
        if (k === 0) { const gen = Math.floor(t * 2) % 1000; text(`génération ${gen}`, cx, H * 0.92, { align: "center", mono: true, size: 12, color: C.muted });
          for (let j = 0; j < 7; j++) { let x = cx - 90 * sc, y = cy + 70 * sc, h = -0.6, pts = [[x, y]]; const seed = Math.sin(gen * 12.9 + j * 78.2) * 43758.5;
            for (let i = 0; i < 40; i++) { const r = Math.sin(seed + i * 1.7) * 0.5 + Math.sin(seed * 0.3 + i * 0.4) * 0.3; h += r * 0.35; x += Math.cos(h) * 5 * sc; y += Math.sin(h) * 5 * sc; pts.push([x, y]); }
            line(pts, alpha(C.sink, 0.55), 1.3); } }
        else { const it = Math.min(1, (t % 8) / 6); const pts = []; for (let i = 0; i <= 160; i++) { const u = i / 160; const a = u * 6 * Math.PI; const r0 = 70 * (1 - u) + 22 * u; const wob = (1 - it) * 18 * Math.sin(u * 23 + t);
            pts.push([cx + (r0 + wob) * sc * Math.cos(a) - (1 - u) * 40 * sc, cy + (r0 + wob) * sc * Math.sin(a) + (1 - u) * 30 * sc]); }
          line(pts, C.climb, 2); text(`itération ${Math.round(it * 60)}`, cx, H * 0.92, { align: "center", mono: true, size: 12, color: C.muted }); } });
    } });

  S.push({ name: "Les données", html: `
    <div class="kicker">Phase 3 · les données</div>
    <h1>15&nbsp;080 situations résolues par le professeur</h1>
    <p>Chaque situation tire un thermique (force, position), un vent et un point de départ au hasard. Le professeur les résout toutes, dans les deux sens de rotation, sur 21 nœuds de 32 cœurs du cluster le cluster, en un quart d'heure.</p>
    <div class="big"><div class="stat"><div class="v" id="ctr">0</div><div class="k">situations</div></div><div class="stat"><div class="v">21&nbsp;034</div><div class="k">trajectoires (aile par tronçons)</div></div></div>`,
    draw(t) {
      const cols = Math.max(6, Math.floor(W / 70)), rows = Math.max(4, Math.floor(H / 70)), cw = W / cols, ch = H / rows, shown = Math.min(cols * rows, Math.floor(t * 9));

  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  let start = 0; try { start = Math.min(S.length - 1, Math.max(0, parseInt(localStorage.getItem("gw-live-slide") || "0", 10) || 0)); } catch (e) {}
  if (location.hash) { const k = S.findIndex(s => s.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") === location.hash.slice(1)); if (k >= 0) start = k; }
  go(start); requestAnimationFrame(loop);
})();
