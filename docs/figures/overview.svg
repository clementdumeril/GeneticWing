<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="622" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- zones -->
  <g fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4">
    <rect x="24" y="24" width="232" height="396" rx="10"/>
    <rect x="288" y="24" width="196" height="396" rx="10"/>
    <rect x="516" y="24" width="368" height="396" rx="10"/>
    <rect x="916" y="24" width="260" height="396" rx="10"/>
  </g>
  <g font-size="15" fill="#5A6875" letter-spacing="1.5">
    <text x="40" y="48">1 PHYSICS</text>
    <text x="304" y="48">2 SIMULATORS</text>
    <text x="532" y="48">3 PLANNER</text>
    <text x="932" y="48">4 CLOSED-LOOP FLIGHT</text>
  </g>

  <!-- 1 PHYSICS -->
  <g stroke-width="1.5">
    <rect x="40" y="72" width="200" height="64" rx="10" fill="#DCF1EE" stroke="#0D7A6F"/>
    <rect x="40" y="152" width="200" height="64" rx="10" fill="#DCF1EE" stroke="#0D7A6F"/>
    <rect x="40" y="232" width="200" height="64" rx="10" fill="#DCF1EE" stroke="#0D7A6F"/>
    <rect x="40" y="312" width="200" height="64" rx="10" fill="#DCF1EE" stroke="#0D7A6F"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="100" font-size="19" fill="#15202A">Aircraft polar</text>
    <text x="140" y="123" font-size="15" fill="#5A6875">SB-XC sailplane, 4.6 m</text>
    <text x="140" y="180" font-size="19" fill="#15202A">Strip-theory wing</text>
    <text x="140" y="203" font-size="15" fill="#5A6875">inner-wing stall</text>
    <text x="140" y="260" font-size="19" fill="#15202A">Allen thermals</text>
    <text x="140" y="283" font-size="15" fill="#5A6875">drifting with the wind</text>
    <text x="140" y="340" font-size="19" fill="#15202A">Dryden turbulence</text>
    <text x="140" y="363" font-size="15" fill="#5A6875">MIL-F-8785C</text>
  </g>

  <!-- 2 SIMULATORS -->
  <rect x="304" y="104" width="164" height="104" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <text x="386" y="138" font-size="19" text-anchor="middle" fill="#15202A">RK4 point mass</text>
  <text x="386" y="164" font-size="15" text-anchor="middle" fill="#5A6875">path tracker,</text>
  <text x="386" y="184" font-size="15" text-anchor="middle" fill="#5A6875">attitude lag, motor</text>

  <rect x="304" y="248" width="164" height="104" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <text x="386" y="282" font-size="19" text-anchor="middle" fill="#15202A">PyTorch twin</text>
  <text x="386" y="308" font-size="15" text-anchor="middle" fill="#5A6875">batched, bounded</text>
  <text x="386" y="328" font-size="15" text-anchor="middle" fill="#5A6875">commands, RK4</text>

  <!-- 3 PLANNER -->
  <rect x="532" y="64" width="336" height="60" rx="10" fill="#F1F4F6" stroke="#8A9AA8" stroke-width="1.5"/>
  <text x="700" y="90" font-size="19" text-anchor="middle" fill="#15202A">Teacher, offline</text>
  <text x="700" y="112" font-size="15" text-anchor="middle" fill="#5A6875">reactive law + SLSQP, about 35 s per plan</text>

  <rect x="532" y="156" width="336" height="60" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="700" y="182" font-size="19" text-anchor="middle" fill="#15202A">Command VAE, <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">d</tspan> = 16</text>
  <text x="700" y="204" font-size="15" text-anchor="middle" fill="#5A6875">decoder = commands + simulator</text>

  <rect x="532" y="248" width="336" height="60" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="700" y="274" font-size="19" text-anchor="middle" fill="#15202A">GA in the latent space</text>
  <text x="700" y="296" font-size="15" text-anchor="middle" fill="#5A6875">3,000 simulated flights, 13 s per plan</text>

  <rect x="532" y="340" width="336" height="60" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="2.2"/>
  <text x="700" y="366" font-size="19" text-anchor="middle" fill="#15202A">Distilled generator</text>
  <text x="700" y="388" font-size="15" text-anchor="middle" fill="#5A6875">flow matching, 64 candidates flown, 0.24 s</text>

  <g font-size="15" fill="#5A6875">
    <text x="612" y="145">20,923 solutions</text>
    <text x="612" y="237">latent box</text>
    <text x="612" y="329">best latent points</text>
  </g>

  <!-- 4 FLIGHT -->
  <image href="overview/xc_flight.png" x="932" y="64" width="228" height="155"/>
  <rect x="932" y="64" width="228" height="155" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="1046" y="238" font-size="15" text-anchor="middle" fill="#5A6875">one 20 km task, MacCready tactician</text>
  <text x="1046" y="300" font-size="42" font-weight="bold" text-anchor="middle" fill="#B8461F">2.23 m/s</text>
  <text x="1046" y="328" font-size="16" text-anchor="middle" fill="#15202A">mean climb, 64 tasks of 20 km</text>
  <text x="1046" y="352" font-size="16" text-anchor="middle" fill="#5A6875">circling rule: 1.29 m/s</text>
  <text x="1046" y="376" font-size="16" text-anchor="middle" fill="#5A6875">latent GA: 2.08 m/s</text>
  <text x="1046" y="400" font-size="15" text-anchor="middle" fill="#5A6875">MacCready 0.5, thermals known</text>

  <!-- arrows -->
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M256,228 H286"/>
    <path d="M484,228 H514"/>
    <path d="M884,228 H914"/>
    <path d="M600,124 V154"/>
    <path d="M600,216 V246"/>
    <path d="M600,308 V338"/>
  </g>
  <path d="M1046,420 V448 H760 V402" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="772" y="440" font-size="15" fill="#15202A">DAgger: 1,095 plans met in flight</text>

  <!-- band -->
  <line x1="24" y1="464" x2="1176" y2="464" stroke="#D0D7DE"/>
  <text x="40" y="488" font-size="15" fill="#5A6875" letter-spacing="1.5">HOW THE CHAIN WAS FOUND</text>

  <image href="overview/turn_limits.png" x="40" y="504" width="176" height="94"/>
  <rect x="40" y="504" width="176" height="94" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="232" y="530" font-size="26" font-weight="bold" fill="#15202A">18 m</text>
  <text x="232" y="556" font-size="16" fill="#15202A">tightest turn at 9 m/s</text>
  <text x="232" y="578" font-size="16" fill="#5A6875">strip wing; point mass: 9 m</text>

  <image href="overview/methods.png" x="432" y="506" width="176" height="74"/>
  <rect x="432" y="506" width="176" height="74" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="624" y="530" font-size="26" font-weight="bold" fill="#15202A">+0.82</text>
  <text x="624" y="556" font-size="16" fill="#15202A">energy over the teacher</text>
  <text x="624" y="578" font-size="16" fill="#5A6875">latent GA, 77 situations</text>

  <image href="overview/student.png" x="840" y="500" width="100" height="100"/>
  <rect x="840" y="500" width="100" height="100" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="958" y="530" font-size="26" font-weight="bold" fill="#15202A">57x less</text>
  <text x="958" y="556" font-size="16" fill="#15202A">compute than the GA,</text>
  <text x="958" y="578" font-size="16" fill="#5A6875">same cost (-5.72 vs -5.66)</text>
</svg>
